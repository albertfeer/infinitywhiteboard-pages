<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Store API Test</title></head>
<body>
<h2>Windows Store API 检测</h2>
<pre id="log"></pre>
<script>
const log = (msg) => { document.getElementById('log').textContent += msg + '\n'; console.log(msg); };

log('=== 开始检测 ===');

// 1. Windows 对象
if (typeof Windows === 'undefined') {
  log('❌ Windows 对象不存在（非 Store App 环境）');
} else {
  log('✅ Windows 对象存在');
  log('   Windows 键:' + Object.keys(Windows).slice(0,10).join(', '));
}

// 2. Services.Store
try {
  if (Windows.Services && Windows.Services.Store) {
    log('✅ Windows.Services.Store 存在');
    
    const context = Windows.Services.Store.StoreContext.getDefault();
    log('✅ StoreContext.getDefault() 成功');
    
    // 3. user
    if (context.user) {
      log('✅ context.user 存在');
      log('   displayName: ' + (context.user.displayName || '(空)'));
      log('   firstName: ' + (context.user.firstName || '(空)'));
      
      const keys = [];
      for (const k in context.user) keys.push(k);
      log('   user keys: ' + keys.join(', '));
    } else {
      log('❌ context.user 为 null/undefined');
    }
    
    // 4. getAppLicenseAsync
    context.getAppLicenseAsync().then(license => {
      log('✅ getAppLicenseAsync 成功');
      log('   isActive: ' + license.isActive);
      log('   isTrial: ' + license.isTrial);
      log('   addOnLicenses 数量: ' + (license.addOnLicenses ? license.addOnLicenses.length : 0));
      
      // 再次检查 user（可能在异步操作后填充）
      if (context.user) {
        log('   context.user.displayName: ' + (context.user.displayName || '(空)'));
        log('   context.user.firstName: ' + (context.user.firstName || '(空)'));
      } else {
        log('   (异步后 context.user 仍为 null)');
      }
    }).catch(err => {
      log('❌ getAppLicenseAsync 失败: ' + err.message);
    });
    
  } else {
    log('❌ Windows.Services.Store 不存在');
    log('   Services 子对象: ' + (Windows.Services ? Object.keys(Windows.Services).join(', ') : '无'));
  }
} catch(e) {
  log('❌ 异常: ' + e.message);
}
</script>
</body></html>
