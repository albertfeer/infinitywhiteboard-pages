<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0044CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  <!-- 无限符号 + 画笔/画布概念 -->
  <g transform="translate(96,96)" fill="none" stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- 无限符号路径 (∞) - 用手写风格 -->
    <path d="
      M -42,-8
      C -42,-28 -18,-40 0,-28
      C 18,-40 42,-28 42,-8
      C 42,12 18,24 0,12
      C -18,24 -42,12 -42,-8
    " />
    <!-- 中心小画笔尖点缀 -->
    <circle cx="0" cy="0" r="7" fill="white" stroke="none"/>
  </g>
</svg>