<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0044CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 圆角方形背景 -->
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  <!-- 无限符号 + 画笔/画布概念 -->
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- 无限符号路径 (∞) - 手写风格 -->
    <path d="
      M -112,-22
      C -112,-74 -48,-106 0,-74
      C 48,-106 112,-74 112,-22
      C 112,32 48,64 0,32
      C -48,64 -112,32 -112,-22
    " />
    <!-- 中心画笔尖点缀 -->
    <circle cx="0" cy="0" r="18" fill="white" stroke="none"/>
  </g>
</svg>